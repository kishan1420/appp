services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kisaan
      POSTGRES_PASSWORD: kisaan
      POSTGRES_DB: kisaan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kisaan -d kisaan"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgres://kisaan:kisaan@db:5432/kisaan
      JWT_SECRET: change-me-in-production
    ports:
      - "4000:4000"

volumes:
  pgdata:
